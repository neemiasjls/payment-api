services:
  api:
    build: .
    # Demonstração local: Development aplica migrations e cria a chave demo.
    # A porta fica disponível somente no host local.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Data Source=/data/paymentgateway.db"
      Gateway__Processor: ${GATEWAY_PROCESSOR:-fake}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      # O SQLite persiste eventos do outbox, idempotência e ledger entre restarts.
      - gateway-data:/data

volumes:
  gateway-data:
