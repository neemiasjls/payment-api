name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore

      - name: Verificar pacotes com vulnerabilidades conhecidas
        # O comando só lista; o grep transforma "achou vulnerabilidade" em falha.
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Testar
        run: dotnet test --no-build --configuration Release --verbosity normal
