name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar e auditar dependências
        # No CI, NU1902-NU1904 também falham o restore. Na máquina local,
        # Directory.Build.props mantém esses avisos informativos.
        run: dotnet restore -p:NuGetAudit=true -p:NuGetAuditLevel=moderate -p:WarningsNotAsErrors=

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Testar
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagem de sandbox
        run: docker build --tag payment-gateway-sandbox:ci .
